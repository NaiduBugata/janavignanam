services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-dev-only
    ports:
      - "55432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      VECTOR_STORE: pgvector
      PGVECTOR_DATABASE_URL: postgresql://rag:rag-dev-only@pgvector:5432/rag
    ports:
      - "8000:8000"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data:
