<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — JanaVignanam</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8f9fa;
        color: #1a1a2e;
        padding: 1.5rem;
      }
      .card {
        text-align: center;
        max-width: 380px;
        background: #fff;
        border-radius: 1.25rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      }
      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        background: #293b5f;
        color: #fff;
        border-radius: 1rem;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 1.5rem;
      }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
      p { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        opacity: 0.4;
      }
      button {
        background: #293b5f;
        color: #fff;
        border: none;
        border-radius: 0.625rem;
        padding: 0.625rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover { opacity: 0.85; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">JV</div>
      <div class="icon">📡</div>
      <h1>You're offline</h1>
      <p>
        JanaVignanam needs a connection to load constituency data.
        Check your network and try again.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
